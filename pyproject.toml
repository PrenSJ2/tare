[project]
name = "tare"
version = "0.2.0"
description = "Find what your Claude Code setup actually costs, and shelve what it never uses."
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.scripts]
tare = "tare.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tare"]

[tool.hatch.build.targets.wheel.force-include]
"src/tare/web" = "tare/web"
